services:
  db:
    image: postgres:16-alpine
    container_name: nexushub-local-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexushub
      POSTGRES_USER: nexushub
      POSTGRES_PASSWORD: nexushub
    ports:
      - "5433:5432"
    volumes:
      - nexushub_local_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexushub -d nexushub"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: nexushub-local-backend
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexushub-local-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/nexushub
      SPRING_DATASOURCE_USERNAME: nexushub
      SPRING_DATASOURCE_PASSWORD: nexushub
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      APP_CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:8080,http://localhost:8085,http://dsc.rodrigor.com,https://dsc.rodrigor.com,http://eq01.dsc.rodrigor.com,https://eq01.dsc.rodrigor.com
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://llm.rodrigor.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-dsc-eq01}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-https://otel.dsc.rodrigor.com}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nexushub-local-frontend
    build:
      context: ./view
      dockerfile: Dockerfile
    container_name: nexushub-local-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  nexushub_local_postgres_data:
